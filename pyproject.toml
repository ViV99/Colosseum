[project]
name = "colosseum"
version = "0.1.0"
description = "Distributed RL training framework for competitive bot programming"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "gymnasium>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "lz4>=4.3.0",
    "wandb>=0.16.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
colosseum = "colosseum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colosseum"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
