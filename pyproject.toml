[project]
name = "colosseum"
version = "0.1.0"
description = "Distributed RL training framework for competitive bot programming"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26.0",
    "gymnasium>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "lz4>=4.3.0",
    "click>=8.1.0",
    "grpcio>=1.84",
    "protobuf>=7.35.1",
    "cryptography>=42",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.16.0",
]
examples = [
    "Box2D>=2.3.10",  # examples/space_miners (import Box2D); has cp312 manylinux wheels
]
# grpcio-tools regenerates colosseum/net/proto (scripts/gen_proto.sh); the old colosseum/transport/colosseum_pb2*.py
# (SP1, removed in T7.2) was generated by 1.78.
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "grpcio-tools>=1.84",
]

[project.scripts]
colosseum = "colosseum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colosseum"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "src/colosseum/transport/colosseum_pb2.py",
    "src/colosseum/transport/colosseum_pb2_grpc.py",
    "src/colosseum/net/proto/colosseum_v1_pb2.py",
    "src/colosseum/net/proto/colosseum_v1_pb2_grpc.py",
    "review",
    "research",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B027",   # empty non-abstract methods in ABCs are intentional optional hooks
    "B905",   # zip() without strict= : lengths are checked explicitly where it matters
    "UP042",  # keep `class X(str, Enum)`; StrEnum changes str() formatting
]

[tool.ruff.lint.isort]
known-first-party = ["arena_kit", "cli_runner", "colosseum", "demo_checks", "demo_learning", "examples", "game_harness", "game_helpers", "game_learning_envs", "net_kit", "pipeline_kit", "report_kit", "sp2_bandits", "sp3_bandits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
    "gpu: needs a CUDA device (auto-skipped without CUDA)",
    "slow: longer than ~20 s; excluded from the fast suite (-m 'not gpu and not slow')",
]
