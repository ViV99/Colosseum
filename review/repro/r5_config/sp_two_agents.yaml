agents:
  a: {}
  b: {}
algorithm:
  entropy_coeff: 0.01
  eps_clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  lr_schedule: constant
  max_grad_norm: 0.5
  minibatch_chunks: 0
  name: appo
  num_epochs: 1
  value_loss_coeff: 0.5
  vtrace_c_bar: 1.0
  vtrace_rho_bar: 1.0
checkpoint:
  dir: ck_sp2
  save_optimizer: true
env:
  env_class: examples.tic_tac_toe.env.TicTacToeEnv
  kwargs: {}
  num_players: 2
learner:
  batch_chunks: 8
  device: auto
  queue_size: 32
metrics:
  log_interval: 10
  use_wandb: false
  wandb_entity: null
  wandb_project: colosseum
networks:
  encoder_class: examples.tic_tac_toe.networks.TicTacToeEncoder
  kwargs: {}
  policy_class: examples.tic_tac_toe.networks.TicTacToePolicy
  value_class: examples.tic_tac_toe.networks.TicTacToeValue
rollout:
  chunk_length: 32
  envs_per_worker: 8
  match_refresh_interval_sec: 0
  num_workers: 1
  weight_sync_interval_sec: 2.0
self_play:
  checkpoint_interval: 50
  latest_prob: 0.5
  pool_size: 10
training:
  phase: self_play
  total_timesteps: 3000
transport:
  mode: local
