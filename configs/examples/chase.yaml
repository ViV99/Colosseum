# Composite Dict action space (direction: Discrete(4), speed: Box(1)).
run:
  name: null
  dir: "runs"

env:
  env_class: "examples.composite_action.env.ChaseEnv"
  num_players: 2
  kwargs: {}

networks:
  encoder_class: "examples.composite_action.networks.ChaseEncoder"
  core: null
  policy_class: "examples.composite_action.networks.ChasePolicy"
  value_class: "examples.composite_action.networks.ChaseValue"
  kwargs: {}

algorithm:
  gamma: 0.99
  vtrace_lambda: 1.0
  entropy_coeff: 0.01
  learning_rate: 3.0e-4
  lr_schedule: "constant"

rollout:
  chunk_length: 20
  num_workers: 2
  envs_per_worker: 4
  weight_sync_interval_sec: 2.0
  torch_threads: 1

learner:
  device: "auto"
  queue_size: 32
  batch_chunks: 8

training:
  phase: "self_play"
  total_timesteps: 50000

self_play:
  checkpoint_interval: 10
  pool_size: 5
  latest_prob: 0.5

metrics:
  use_wandb: false
  log_interval: 10
