# Requires Box2D: pip install -e ".[examples]"
run:
  name: null
  dir: "runs"

env:
  env_class: "examples.space_miners.env.SpaceMinersEnv"
  num_players: 2
  kwargs:
    preset: "Round 1"
    max_ticks: 1000

networks:
  encoder_class: "examples.space_miners.networks.SpaceMinersEncoder"
  core: null
  policy_class: "examples.space_miners.networks.SpaceMinersPolicy"
  value_class: "examples.space_miners.networks.SpaceMinersValue"
  kwargs: {}

algorithm:
  gamma: 0.99
  vtrace_lambda: 1.0
  entropy_coeff: 0.01
  learning_rate: 3.0e-4
  lr_schedule: "linear"

rollout:
  chunk_length: 256
  num_workers: 2
  envs_per_worker: 4
  weight_sync_interval_sec: 5.0
  torch_threads: 1

learner:
  device: "auto"
  queue_size: 64
  batch_chunks: 16

training:
  phase: "self_play"
  total_timesteps: 500000

self_play:
  checkpoint_interval: 100
  pool_size: 10
  latest_prob: 0.5

metrics:
  use_wandb: false
  log_interval: 50
