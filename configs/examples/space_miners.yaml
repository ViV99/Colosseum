env:
  env_class: "examples.space_miners.env.SpaceMinersEnv"
  num_players: 2
  kwargs:
    preset: "Round 1"
    max_ticks: 1000

networks:
  encoder_class: "examples.space_miners.networks.SpaceMinersEncoder"
  core: null              # e.g. {class: colosseum.networks.cores.LSTMCore, kwargs: {hidden_size: 128}}
  policy_class: "examples.space_miners.networks.SpaceMinersPolicy"
  value_class: "examples.space_miners.networks.SpaceMinersValue"
  kwargs: {}

algorithm:
  name: "appo"
  gamma: 0.99
  vtrace_lambda: 1.0
  eps_clip: 0.2
  value_loss_coeff: 0.5
  entropy_coeff: 0.01
  max_grad_norm: 0.5
  num_epochs: 1
  minibatch_chunks: 0
  vtrace_rho_bar: 1.0
  vtrace_c_bar: 1.0
  learning_rate: 3.0e-4
  lr_schedule: "linear"

rollout:
  chunk_length: 256
  num_workers: 2
  envs_per_worker: 4
  weight_sync_interval_sec: 5.0

learner:
  device: "auto"
  queue_size: 64
  batch_chunks: 16

training:
  phase: "self_play"
  total_timesteps: 500000

self_play:
  checkpoint_interval: 100   # train steps
  pool_size: 10
  latest_prob: 0.5

checkpoint:
  save_optimizer: true

metrics:
  use_wandb: false
  log_interval: 50

transport:
  mode: "local"
